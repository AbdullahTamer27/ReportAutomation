name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: well_tools_1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt -r dev-requirements.txt

      - name: Run tests
        # Real fixtures are git-ignored (large / machine-specific), so those
        # golden tests skip on CI; the synthetic golden + all unit tests run.
        run: python -m pytest -q
