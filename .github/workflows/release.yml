name: release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
#
# What it does:
#   1. runs the test suite (gate — never ship a failing build)
#   2. builds Talos.exe on Windows, stamped with the version + commit (provenance)
#   3. (optional) code-signs it if a cert secret is present
#   4. publishes the exe + SHA256 to the PUBLIC Talos-releases repo
#   5. bumps that repo's manifest.json "latest" to the new version
#
# Required secret (in THIS private repo → Settings → Secrets and variables → Actions):
#   RELEASES_TOKEN        fine-grained PAT with Contents: write on Talos-releases
# Optional secrets (enable code-signing once you have a self-signed cert):
#   CODESIGN_PFX_BASE64   base64 of your .pfx
#   CODESIGN_PFX_PASSWORD the .pfx password

on:
  push:
    tags: ["v*"]

env:
  RELEASES_REPO: AbdullahTamer27/Talos-releases

jobs:
  # ---- 1) Gate: tests must pass (same as test.yml, on the tagged commit) ----
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: well_tools_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt -r dev-requirements.txt
      - run: python -m pytest -q

  # ---- 2) Build + sign + publish ----
  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: well_tools_1
        shell: bash
    env:
      HAS_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt pyinstaller pywin32

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp version + provenance
        # Set the shipped version to the tag, and record the exact commit the
        # build came from — so every exe traces back to a signed commit.
        run: |
          python - <<'PY'
          import os, datetime
          ver = os.environ["VERSION"]
          sha = os.environ["GITHUB_SHA"]
          built = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("webapp/version.py", "w") as f:
              f.write('"""Single source of truth for the application version."""\n\n')
              f.write(f'__version__ = "{ver}"\n')
          with open("webapp/build_info.py", "w") as f:
              f.write('"""Build provenance — generated by release.yml (not committed)."""\n\n')
              f.write(f'VERSION = "{ver}"\nCOMMIT = "{sha}"\nBUILT = "{built}"\n')
          print("stamped", ver, sha)
          PY

      - name: Build Talos.exe
        run: pyinstaller --clean --noconfirm Talos.spec

      - name: Code-sign (optional — only if a cert secret is configured)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        working-directory: well_tools_1
        run: |
          $pfx = "$env:RUNNER_TEMP\talos.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Talos.exe
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}

      - name: SHA256 checksum
        run: |
          cd dist
          python -c "import hashlib; d=open('Talos.exe','rb').read(); open('Talos.exe.sha256','w').write(hashlib.sha256(d).hexdigest()+'  Talos.exe\n')"
          cat Talos.exe.sha256

      - name: Publish release to Talos-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          notes="Talos ${VERSION}
          Commit: ${GITHUB_SHA}
          Built by release.yml from tag ${GITHUB_REF_NAME}."
          gh release create "${GITHUB_REF_NAME}" \
            dist/Talos.exe dist/Talos.exe.sha256 \
            --repo "${RELEASES_REPO}" \
            --title "Talos ${VERSION}" \
            --notes "${notes}"

      - name: Bump manifest.json 'latest' in Talos-releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git" "$RUNNER_TEMP/rel"
          cd "$RUNNER_TEMP/rel"
          python - <<'PY'
          import json, os
          p = "manifest.json"
          try:
              d = json.load(open(p))
          except (FileNotFoundError, ValueError):
              d = {"latest": "", "required_min": "0.0.0", "kill_below": "0.0.0",
                   "blocked_users": [], "blocked_machines": [], "message": ""}
          d["latest"] = os.environ["VERSION"]
          json.dump(d, open(p, "w"), indent=2)
          PY
          git config user.name "talos-ci"
          git config user.email "ci@talos.local"
          git commit -am "release: latest ${VERSION}" || echo "manifest already current"
          git push
